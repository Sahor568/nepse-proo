services:
  # Backend Express API Service
  - type: web
    name: nepse-pro-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --force && npm rebuild sqlite3 --build-from-source
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: FRONTEND_URL
        value: https://nepse-pro.vercel.app
      - key: GOOGLE_CALLBACK_URL
        value: https://nepse-pro-backend.onrender.com/api/auth/google/callback
      # Secure JWT secret will be automatically generated for you by Render
      - key: JWT_SECRET
        generateValue: true
      # Google OAuth Keys (you can edit these in Render dashboard if you set them up)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
